name: Protected access tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/access-worker.test.mjs tests/ffmpeg-security.test.mjs tests/social-presets.test.mjs
